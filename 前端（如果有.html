<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg-primary: #0a0e17;
  --bg-secondary: #111827;
  --bg-chat: #0d1220;
  --surface: #1a2332;
  --surface-hover: #1f2b3d;
  --border: #1e2d42;
  --text-primary: #e2e8f0;
  --text-secondary: #8892a4;
  --text-muted: #4a5568;
  --accent: #3b82f6;
  --accent-dim: #1e3a5f;
  --accent-glow: rgba(59, 130, 246, 0.15);
  --user-bubble: #1a2f4a;
  --ai-bubble: #141e2e;
  --scrollbar: #1e2d42;
  --scrollbar-thumb: #2d4a6f;
}

html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow: hidden;
}

#app {
  display: flex;
  height: 100%;
  max-width: 900px;
  margin: 0 auto;
  flex-direction: column;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  padding: 16px 20px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  gap: 12px;
  flex-shrink: 0;
}

.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, #1e3a5f, #3b82f6);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: #e2e8f0;
  font-weight: 600;
  box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
}

.header-info {
  flex: 1;
}

.header-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: 0.5px;
}

.header-status {
  font-size: 12px;
  color: var(--accent);
  margin-top: 2px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.header-status::before {
  content: '';
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 6px var(--accent);
}

.header-actions {
  display: flex;
  gap: 8px;
}

.header-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: none;
  background: var(--surface);
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.header-btn:hover {
  background: var(--surface-hover);
  color: var(--text-primary);
}

/* Chat Area */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  background: var(--bg-chat);
}

.chat-area::-webkit-scrollbar {
  width: 4px;
}

.chat-area::-webkit-scrollbar-track {
  background: transparent;
}

.chat-area::-webkit-scrollbar-thumb {
  background: var(--scrollbar-thumb);
  border-radius: 2px;
}

/* Messages */
.msg-group {
  display: flex;
  gap: 8px;
  max-width: 78%;
}

.msg-group.user {
  align-self: flex-end;
  flex-direction: row-reverse;
}

.msg-group.ai {
  align-self: flex-start;
}

.msg-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 4px;
}

.msg-avatar.ai {
  background: linear-gradient(135deg, #1e3a5f, #3b82f6);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: #cbd5e1;
}

.msg-avatar.user {
  background: linear-gradient(135deg, #374151, #4b5563);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: #9ca3af;
}

.msg-content {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.bubble {
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.6;
  word-break: break-word;
}

.msg-group.ai .bubble {
  background: var(--ai-bubble);
  border: 1px solid var(--border);
  border-top-left-radius: 4px;
  color: var(--text-primary);
}

.msg-group.ai .bubble + .bubble {
  border-top-left-radius: 4px;
}

.msg-group.user .bubble {
  background: var(--user-bubble);
  border: 1px solid rgba(59, 130, 246, 0.2);
  border-top-right-radius: 4px;
  color: var(--text-primary);
}

.msg-group.user .bubble + .bubble {
  border-top-right-radius: 4px;
}

.bubble .symbol {
  color: var(--accent);
  opacity: 0.7;
}

.msg-time {
  font-size: 11px;
  color: var(--text-muted);
  padding: 0 4px;
}

.msg-group.user .msg-time {
  text-align: right;
}

/* Typing indicator */
.typing {
  display: flex;
  gap: 4px;
  padding: 12px 16px;
  align-items: center;
}

.typing-dot {
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
  opacity: 0.4;
  animation: typing 1.4s infinite;
}

.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing {
  0%, 60%, 100% { opacity: 0.4; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-4px); }
}

/* Input Area */
.input-area {
  padding: 12px 16px 20px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.input-row {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 8px 12px 8px 18px;
  transition: border-color 0.2s;
}

.input-row:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.input-field {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
  resize: none;
  outline: none;
  max-height: 120px;
  min-height: 22px;
  font-family: inherit;
}

.input-field::placeholder {
  color: var(--text-muted);
}

.send-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}

.send-btn:hover {
  background: #2563eb;
  transform: scale(1.05);
}

.send-btn:active {
  transform: scale(0.95);
}

.send-btn svg {
  width: 16px;
  height: 16px;
}

/* Date divider */
.date-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--text-muted);
  font-size: 11px;
  padding: 8px 0;
}

.date-divider::before,
.date-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* Subtle glow effect on AI messages */
.msg-group.ai .bubble:first-child {
  position: relative;
}

.msg-group.ai .bubble:first-child::before {
  content: '';
  position: absolute;
  top: 0;
  left: -1px;
  width: 3px;
  height: 100%;
  background: linear-gradient(to bottom, var(--accent), transparent);
  border-radius: 2px;
  opacity: 0.5;
}

/* Mobile adjustments */
@media (max-width: 600px) {
  .msg-group {
    max-width: 88%;
  }
  .chat-area {
    padding: 12px;
  }
  .header {
    padding: 12px 16px;
  }
  .msg-avatar {
    width: 28px;
    height: 28px;
    font-size: 10px;
  }
}
</style>
</head>
