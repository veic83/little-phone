name: Deploy to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject config
        run: echo "$CONFIG_B64" | base64 -d > config.js
        env:
          CONFIG_B64: ${{ secrets.CONFIG_JS_CONTENT }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
