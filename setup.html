<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>初始设置</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon_48.png" type="image/png">
<link rel="apple-touch-icon" href="icon_192.png"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#111;color:#eee;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}.box{background:#1e1e2e;border-radius:16px;padding:32px 24px;width:400px;max-width:100%}h1{font-size:22px;margin-bottom:4px}.sub{color:#9ca3af;font-size:13px;margin-bottom:16px;line-height:1.5}label{display:block;font-size:12px;color:#9ca3af;margin-bottom:4px;margin-top:14px}input,select{width:100%;padding:10px 12px;border:1px solid #374151;border-radius:8px;background:#0d0d0d;color:#eee;font-size:14px;outline:none}input:focus,select:focus{border-color:#3b82f6}.hint{font-size:11px;color:#6b7280;margin-top:3px}.row{display:flex;gap:10px}.row>*{flex:1}button{width:100%;padding:12px;margin-top:18px;background:#3b82f6;border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:600;cursor:pointer}button:active{opacity:.8}.ok{color:#34d399;font-size:13px;margin-top:10px;display:none}.preset{font-size:12px;color:#3b82f6;cursor:pointer;margin-top:4px;display:inline-block}.preset:hover{text-decoration:underline}</style></head><body><div class="box"><h1>⚙️ 设置</h1><div class="sub">填 API 信息，保存后自动生效。</div><label>Supabase URL</label><input id="su" placeholder="https://xxx.supabase.co"><div class="hint">Supabase 项目地址</div><label>Supabase Anon Key</label><input id="sk" placeholder="eyJ..."><div class="hint">Settings → API → anon public key</div><label style="margin-top:18px">AI 模型</label><select id="modelPreset"><option value="">自定义</option><option value="deepseek">DeepSeek</option><option value="openai">OpenAI</option><option value="siliconflow">SiliconFlow</option></select><div class="row"><div><label>接口地址</label><input id="endpoint" placeholder="https://api.deepseek.com/v1/chat/completions"></div><div><label>模型名</label><input id="modelName" placeholder="deepseek-v4-flash"></div></div><label>API Key</label><input id="dk" placeholder="sk-..."><div class="hint" id="presetHint">选预置会自动填地址和模型名</div><button id="btn">保存</button><div id="msg" class="ok">已保存，正在跳转...</div></div><script>
(function(){
  var KEY = 'lil_phone_cfg', PRESETS = { deepseek:{endpoint:'https://api.deepseek.com/v1/chat/completions',model:'deepseek-v4-flash'}, openai:{endpoint:'https://api.openai.com/v1/chat/completions',model:'gpt-4o-mini'}, siliconflow:{endpoint:'https://api.siliconflow.cn/v1/chat/completions',model:'deepseek-v3'} };
  var saved = null;
  try{ var raw = localStorage.getItem(KEY); if(raw) saved = JSON.parse(raw); }catch(e){}

  function fill(data){
    if(!data) return;
    document.getElementById('su').value = data.su || '';
    document.getElementById('sk').value = data.sk || '';
    document.getElementById('endpoint').value = data.ep || '';
    document.getElementById('modelName').value = data.mn || '';
    document.getElementById('dk').value = data.dk || '';
  }
  if(saved) fill(saved);

  document.getElementById('modelPreset').onchange = function(){
    var p = PRESETS[this.value];
    if(p){ document.getElementById('endpoint').value = p.endpoint; document.getElementById('modelName').value = p.model; }
    document.getElementById('presetHint').textContent = this.value ? '已填入 ' + this.value : '选预置会自动填地址和模型名';
  };

  document.getElementById('btn').onclick = function(){
    var su = document.getElementById('su').value.trim();
    var sk = document.getElementById('sk').value.trim();
    var ep = document.getElementById('endpoint').value.trim();
    var mn = document.getElementById('modelName').value.trim();
    var dk = document.getElementById('dk').value.trim();
    if(!su || !sk || !ep || !mn || !dk){ alert('请填完所有字段'); return; }

    var cfg = { su:su, sk:sk, dk:dk, ep:ep, mn:mn, th:{accent:'#3b82f6',mode:'dark'}, mu:'', mh:{} };
    localStorage.setItem(KEY, JSON.stringify(cfg));
    document.getElementById('msg').style.display = 'block';
    document.getElementById('btn').disabled = true; document.getElementById('btn').textContent = '已保存';

    var from = new URLSearchParams(location.search).get('from') || 'home.html';
    setTimeout(function(){ location.href = from; }, 800);
  };
})();
</script></body></html>
