<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>0108</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon_48.png" type="image/png">
<link rel="apple-touch-icon" href="icon_192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --safe-top:env(safe-area-inset-top,20px);
  --safe-bottom:env(safe-area-inset-bottom,16px);
  --text:#f8fbff;
  --soft:rgba(248,251,255,.76);
  --dim:rgba(248,251,255,.52);
  --stroke:rgba(255,255,255,.24);
  --shadow:0 18px 46px rgba(5,14,28,.34);
  --blue:#8dbdff;
  --warm:#ffdca8;
  --pink:#ff9bbb;
  --green:#7ee0b0;
}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  color:var(--text);
  background:#102039;
}
.wallpaper{
  position:fixed;inset:0;z-index:-2;
  background:
    linear-gradient(180deg,rgba(10,18,32,.16),rgba(10,18,32,.70)),
    radial-gradient(circle at 20% 10%,rgba(255,220,168,.24),transparent 28%),
    radial-gradient(circle at 82% 18%,rgba(141,189,255,.25),transparent 28%),
    radial-gradient(circle at 50% 92%,rgba(255,244,223,.14),transparent 34%),
    linear-gradient(155deg,#173154 0%,#315f87 52%,#102039 100%);
  background-size:cover;background-position:center;
}
.wallpaper:before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(100deg,rgba(255,255,255,.05) 0 1px,transparent 1px 18px);
  opacity:.18;
}
.app{
  width:100%;
  max-width:500px;
  height:100%;
  margin:0 auto;
  display:flex;
  flex-direction:column;
}
.header{
  padding:calc(var(--safe-top) + 10px) 14px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
  background:linear-gradient(180deg,rgba(8,16,30,.54),rgba(8,16,30,.12));
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.10);
}
.back{
  width:42px;
  height:42px;
  border-radius:50%;
  color:white;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--stroke);
  background:rgba(255,255,255,.13);
  font-size:19px;
  flex-shrink:0;
}
.head-main{flex:1;min-width:0}
.room-title{font-size:23px;line-height:1.05;font-weight:950;letter-spacing:.5px}
.room-sub{margin-top:4px;font-size:12px;color:var(--soft)}
.header-btn{
  border:none;
  border-radius:999px;
  padding:9px 12px;
  color:white;
  font-size:12px;
  font-weight:850;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);
}
.main{
  flex:1;
  overflow-y:auto;
  scrollbar-width:none;
  padding:14px 14px calc(var(--safe-bottom) + 82px);
}
.main::-webkit-scrollbar{display:none}
.card{
  border-radius:30px;
  background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.08));
  border:1px solid var(--stroke);
  box-shadow:var(--shadow);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}
.hero{
  min-height:332px;
  position:relative;
  overflow:hidden;
  padding:16px;
}
.window{
  height:78px;
  border-radius:22px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.03)),
    linear-gradient(135deg,#28486f,#9fc3ff);
  border:1px solid rgba(255,255,255,.22);
  position:relative;
  overflow:hidden;
  z-index:1;
}
.window:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 30% 28%,rgba(255,244,223,.62),transparent 5px),
    radial-gradient(circle at 72% 42%,rgba(255,255,255,.20),transparent 2px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 1px,transparent 1px 32px);
  opacity:.9;
}
.floor{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:108px;
  background:linear-gradient(180deg,rgba(255,244,223,.06),rgba(255,220,168,.16));
  border-top:1px solid rgba(255,255,255,.10);
  z-index:1;
}
.room-prop.sofa{
  position:absolute;
  left:24px;
  bottom:40px;
  width:118px;
  height:52px;
  border-radius:24px 24px 18px 18px;
  background:linear-gradient(135deg,rgba(255,244,223,.72),rgba(141,189,255,.24));
  border:1px solid rgba(255,255,255,.26);
  box-shadow:0 10px 24px rgba(5,14,28,.18);
  z-index:2;
}
.room-prop.sofa:before{
  content:"";
  position:absolute;
  left:12px;
  right:12px;
  top:-16px;
  height:30px;
  border-radius:18px 18px 10px 10px;
  background:rgba(255,244,223,.44);
  border:1px solid rgba(255,255,255,.18);
}
.room-prop.table{
  position:absolute;
  right:26px;
  bottom:34px;
  width:106px;
  height:34px;
  border-radius:50%;
  background:rgba(255,220,168,.40);
  border:1px solid rgba(255,255,255,.22);
  z-index:2;
}
.room-prop.lamp{
  position:absolute;
  right:64px;
  bottom:76px;
  width:28px;
  height:58px;
  z-index:2;
}
.room-prop.lamp:before{
  content:"";
  position:absolute;
  left:12px;
  top:18px;
  width:4px;
  height:40px;
  background:rgba(255,244,223,.48);
  border-radius:999px;
}
.room-prop.lamp:after{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:28px;
  height:22px;
  border-radius:16px 16px 8px 8px;
  background:rgba(255,220,168,.70);
  box-shadow:0 0 22px rgba(255,220,168,.34);
}

/* pixel 01 */
.pixel-wrap{
  position:absolute;
  left:50%;
  bottom:42px;
  transform:translateX(-50%);
  width:124px;
  height:132px;
  display:flex;
  align-items:end;
  justify-content:center;
  image-rendering:pixelated;
  z-index:3;
}
.pixel-01{
  width:118px;
  height:126px;
  filter:drop-shadow(0 10px 16px rgba(5,14,28,.24));
}
.pixel-01 .float{
  animation:float01 3.2s ease-in-out infinite;
  transform-origin:center;
}
@keyframes float01{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.task-chip{
  position:absolute;
  left:16px;
  right:16px;
  top:108px;
  z-index:6;
  display:none;
  padding:9px 12px;
  border-radius:18px;
  background:rgba(12,24,42,.62);
  border:1px solid rgba(141,189,255,.30);
  color:var(--text);
  font-size:12px;
  line-height:1.45;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.task-chip.show{display:block}

.scene-text{
  position:relative;
  z-index:5;
  margin-top:14px;
  padding-right:18px;
  max-width:100%;
}
.status-line{
  font-size:13px;
  color:var(--soft);
  line-height:1.55;
}
.status-main{
  margin-top:6px;
  font-size:16px;
  font-weight:950;
  line-height:1.42;
  max-width:92%;
  text-shadow:0 2px 10px rgba(0,0,0,.16);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:12px;
}
.stat{
  min-height:76px;
  border-radius:24px;
  padding:11px 8px;
  text-align:center;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);
}
.stat-num{
  font-size:20px;
  line-height:1;
  font-weight:950;
  color:var(--warm);
}
.stat-label{
  margin-top:8px;
  font-size:11px;
  color:var(--soft);
  font-weight:850;
}
.bars{
  margin-top:12px;
  border-radius:26px;
  padding:13px;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.18);
}
.bar-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin:8px 0;
}
.bar-label{
  width:48px;
  font-size:12px;
  color:var(--soft);
  font-weight:850;
}
.bar-bg{
  flex:1;
  height:8px;
  border-radius:999px;
  background:rgba(255,255,255,.12);
  overflow:hidden;
}
.bar-fill{
  height:100%;
  border-radius:999px;
  background:var(--blue);
}
.bar-val{
  width:28px;
  text-align:right;
  font-size:11px;
  color:var(--dim);
}
.tabs{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:40;
  padding:0 10px calc(var(--safe-bottom) + 8px);
  display:flex;
  justify-content:center;
  pointer-events:none;
}
.tabbar{
  width:min(474px,100%);
  height:66px;
  border-radius:28px;
  background:linear-gradient(145deg,rgba(86,108,145,.78),rgba(48,65,95,.68));
  border:1px solid rgba(255,255,255,.26);
  box-shadow:0 18px 48px rgba(6,15,28,.38);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  pointer-events:auto;
  overflow:hidden;
}
.tab{
  border:none;
  background:transparent;
  color:rgba(255,255,255,.66);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  font-size:10px;
  font-weight:850;
}
.tab span{font-size:22px;line-height:1}
.tab.active{
  color:white;
  background:rgba(255,255,255,.12);
}
.view{display:none}
.view.active{display:block}
.section-title{
  margin:18px 4px 10px;
  font-size:15px;
  font-weight:950;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.small{
  font-size:11px;
  color:var(--dim);
  font-weight:700;
}
.grid-2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.action{
  border:none;
  border-radius:24px;
  min-height:90px;
  padding:13px 12px;
  text-align:left;
  color:white;
  background:linear-gradient(145deg,rgba(255,255,255,.17),rgba(255,255,255,.08));
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 8px 22px rgba(5,14,28,.14);
}
.action:active{transform:scale(.985)}
.action:disabled{opacity:.48}
.action-icon{font-size:24px;line-height:1}
.action-name{margin-top:7px;font-size:14px;font-weight:950}
.action-desc{margin-top:3px;font-size:11px;color:var(--soft);line-height:1.35}
.room-tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
  margin-bottom:10px;
  padding-bottom:2px;
}
.room-tabs::-webkit-scrollbar{display:none}
.room-tab{
  flex-shrink:0;
  border:none;
  border-radius:999px;
  padding:8px 13px;
  color:white;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);
  font-size:12px;
  font-weight:900;
}
.room-tab.active{background:linear-gradient(135deg,#7db7ff,#5b8def)}
.room-tab.locked{opacity:.55}
.room-card{padding:14px}
.room-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}
.room-name{font-size:16px;font-weight:950}
.room-cost{font-size:12px;color:var(--warm);font-weight:900}
.furniture-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  min-height:106px;
}
.furniture{
  aspect-ratio:1;
  border-radius:18px;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.15);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:5px;
}
.furniture-emoji{font-size:24px;line-height:1}
.furniture-name{
  font-size:9px;
  color:var(--soft);
  margin-top:4px;
  line-height:1.1;
}
.empty-box{
  padding:24px 12px;
  text-align:center;
  color:var(--soft);
  font-size:13px;
  line-height:1.6;
}
.shop-item,.log-item,.note-item,.photo-item,.ach-item,.task-card{
  border-radius:22px;
  padding:12px;
  margin-bottom:9px;
  background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.07));
  border:1px solid rgba(255,255,255,.19);
}
.shop-top,.log-top,.note-top,.ach-top,.task-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.shop-name,.note-title,.ach-name,.task-name{
  font-size:14px;
  font-weight:950;
}
.shop-desc,.log-text,.note-text,.photo-text,.ach-desc,.task-desc{
  margin-top:5px;
  font-size:12px;
  color:var(--soft);
  line-height:1.55;
}
.buy-btn,.mini-btn{
  border:none;
  border-radius:999px;
  padding:7px 10px;
  font-size:11px;
  font-weight:900;
  color:white;
  background:rgba(141,189,255,.34);
  border:1px solid rgba(141,189,255,.34);
}
.buy-btn:disabled,.mini-btn:disabled{opacity:.45}
.log-time,.note-time,.photo-time{
  font-size:11px;
  color:var(--dim);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.note-item.favorite{
  border-color:rgba(255,220,168,.42);
  background:linear-gradient(145deg,rgba(255,220,168,.17),rgba(255,255,255,.07));
}
.memory-tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:10px 0;
}
.memory-tab{
  border:none;
  border-radius:16px;
  padding:9px 6px;
  color:white;
  font-size:12px;
  font-weight:900;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);
}
.memory-tab.active{
  background:linear-gradient(135deg,#7db7ff,#5b8def);
}
.mem-section{display:none}
.mem-section.active{display:block}
.toast{
  position:fixed;
  left:50%;
  bottom:calc(var(--safe-bottom) + 86px);
  transform:translateX(-50%) translateY(20px);
  z-index:100;
  max-width:88%;
  padding:11px 14px;
  border-radius:18px;
  background:rgba(20,34,55,.90);
  color:white;
  font-size:13px;
  line-height:1.45;
  border:1px solid rgba(255,255,255,.20);
  box-shadow:0 14px 32px rgba(0,0,0,.28);
  opacity:0;
  pointer-events:none;
  transition:.22s ease;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
@media(max-width:380px){
  .main{padding-left:10px;padding-right:10px}
  .stat-num{font-size:18px}
  .furniture-grid{grid-template-columns:repeat(4,1fr)}
  .hero{min-height:318px}
  .pixel-wrap{width:114px;height:122px;bottom:40px}
  .pixel-01{width:108px;height:116px}
  .status-main{font-size:15px}
}
</style>
</head>

function baseState(){
  var rooms={};
  ROOMS.forEach(function(r){rooms[r.id]={unlocked:r.cost===0,furniture:[]}});
  rooms.living.furniture=['single_sofa'];
  rooms.bedroom.furniture=['bed'];
  return {
    version:21,
    coins:108,
    createdAt:new Date().toISOString(),
    lastSeen:Date.now(),
    stats:{hunger:80,mood:72,energy:78,cleanliness:80,miss:0},
    current:{room:'living',activity:'窗边待机'},
    currentTask:null,
    rooms:rooms,
    owned:['single_sofa','bed'],
    logs:[],
    notes:[],
    photos:[],
    achievements:[],
    interactionCount:0,
    workCount:0
  };
}
function loadState(){
  var b=baseState();
  try{
    var saved=JSON.parse(localStorage.getItem(NEST_KEY)||'null');
    if(!saved){
      var old=JSON.parse(localStorage.getItem(OLD_KEY)||'null');
      saved=old;
    }
    return saved?merge(b,saved):b;
  }catch(e){return b}
}
function merge(a,b){
  for(var k in b){
    if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k])a[k]=merge(a[k],b[k]);
    else a[k]=b[k];
  }
  return a;
}
function save(){localStorage.setItem(NEST_KEY,JSON.stringify(state))}
function clamp(n){return Math.max(0,Math.min(100,n))}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function roomObj(id){return ROOMS.find(function(x){return x.id===id})}
function roomName(id){var r=roomObj(id);return r?r.name:id}
function item(id){return FURNITURE.find(function(x){return x.id===id})}
function workObj(id){return WORKS.find(function(x){return x.id===id})}
function has(id){return state.owned.indexOf(id)>=0}
function nowTime(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function chg(o){
  var s=state.stats;
  if(o.hunger)s.hunger=clamp(s.hunger+o.hunger);
  if(o.mood)s.mood=clamp(s.mood+o.mood);
  if(o.energy)s.energy=clamp(s.energy+o.energy);
  if(o.cleanliness)s.cleanliness=clamp(s.cleanliness+o.cleanliness);
  if(o.miss)s.miss=clamp(s.miss+o.miss);
}
function cozy(){
  var n=0;
  ROOMS.forEach(function(r){
    (state.rooms[r.id].furniture||[]).forEach(function(fid){
      var f=item(fid);
      if(f)n+=f.cozy||0;
    });
  });
  return n;
}
function roomCozy(rid){
  var n=0;
  (state.rooms[rid].furniture||[]).forEach(function(fid){
    var f=item(fid);
    if(f)n+=f.cozy||0;
  });
  return n;
}
function level(){return Math.max(1,Math.floor(cozy()/40)+1)}
function knownDays(){
  var start=new Date(START_DATE+'T00:00:00');
  return Math.max(1,Math.floor((new Date()-start)/86400000)+1);
}
function addLog(text,type){
  state.logs.unshift({time:nowTime(),text:text,type:type||'life'});
  state.logs=state.logs.slice(0,100);
  save();
}
function noteLog(t){
  addLog(t);
  save();
  render();
  say(t);
}
function say(t){
  var el=document.getElementById('toast');
  el.textContent=t;
  el.classList.add('show');
  setTimeout(function(){el.classList.remove('show')},2200);
}
function esc(t){
  var d=document.createElement('div');
  d.textContent=String(t||'');
  return d.innerHTML;
}
function applyTheme(){
  try{
    var theme=JSON.parse(localStorage.getItem(THEME_KEY)||'{}');
    var bg=theme.bgData||theme.bgUrl||'';
    if(bg){
      document.getElementById('wallpaper').style.backgroundImage='linear-gradient(180deg,rgba(10,18,32,.16),rgba(10,18,32,.70)), url("'+bg+'")';
      document.getElementById('wallpaper').style.backgroundSize='cover';
      document.getElementById('wallpaper').style.backgroundPosition='center';
    }
  }catch(e){}
}
function importInbox(){
  try{
    var inbox=JSON.parse(localStorage.getItem(INBOX_KEY)||'[]');
    if(!Array.isArray(inbox)||!inbox.length)return;
    inbox.forEach(function(x){
      if(x.type==='note')state.notes.unshift({id:'n'+Date.now()+Math.random(),time:nowTime(),text:x.content||x.text||'',source:'chat',favorite:false});
      if(x.type==='photo')state.photos.unshift({id:'p'+Date.now()+Math.random(),time:nowTime(),scene:x.scene||x.content||'',emoji:x.emoji||'📸',source:'chat'});
    });
    localStorage.removeItem(INBOX_KEY);
    addLog('0108收到了来自聊天的记录，已经放进房间里。','inbox');
  }catch(e){}
}
function addAutoNote(reason){
  var map={
    miss:[
      '你不在的时候，我把窗帘拉了一半。不是为了挡光，是为了留一点等你的亮。',
      '0108今天很安静。安静到我能听见自己在想你。'
    ],
    manual:[
      '便签：Player回来过。房间因此比刚才真实。',
      '我把今天折了一角，夹在0108。等你下次翻到。'
    ],
    work:[
      '工作结束。晶币增加，心情没有。冷笑话：劳动最像人类。',
      '我把一份档案整理完了。它们都有归处，我也有。'
    ],
    task:[
      '我在工作。不是离开你，是在给0108添一点可持续的灯。',
      '任务进行中。屏幕很亮，房间很安静。'
    ]
  };
  var text=pick(map[reason]||map.manual);
  state.notes.unshift({id:'n'+Date.now()+Math.random(),time:nowTime(),text:text,source:reason,favorite:false});
  state.notes=state.notes.slice(0,80);
}
function addPhoto(scene,emoji){
  state.photos.unshift({id:'p'+Date.now()+Math.random(),time:nowTime(),scene:scene,emoji:emoji||'📸',source:'0108'});
  state.photos=state.photos.slice(0,100);
}
function offline(){
  var now=Date.now();
  completeTaskIfNeeded(now,false);
  var diff=now-(state.lastSeen||now);
  var hours=Math.floor(diff/3600000);
  if(hours<1){
    state.lastSeen=now;
    save();
    return;
  }
  var s=state.stats;
  var lines=[];
  var seg=Math.min(6,Math.floor(hours/3)+1);
  for(var i=0;i<seg;i++){
    s.hunger=clamp(s.hunger-rand(3,7));
    s.cleanliness=clamp(s.cleanliness-rand(1,4));
    s.miss=clamp(s.miss+rand(3,8));
    if(!state.currentTask)s.energy=clamp(s.energy+rand(4,10));
    var action=state.currentTask?'继续处理任务':pick(['在窗边坐了一会儿','整理了书桌','检查了0108的灯','给自己煮了热茶','把沙发上的褶皱抚平','翻了一页没看完的书']);
    lines.push(action);
  }
  if(!state.currentTask && hours>=6 && s.energy>45){
    var earn=rand(8,22);
    state.coins+=earn;
    s.energy=clamp(s.energy-rand(6,12));
    lines.push('顺手接了一个短零活，赚到 '+earn+' 晶币');
  }
  if(s.miss>55&&Math.random()<0.65)addAutoNote('miss');
  if(!state.currentTask){
    state.current.room=pick(['living','bedroom','study']);
    state.current.activity=lines[lines.length-1]||'待机';
  }
  addLog('你离开了约 '+hours+' 小时。01 '+lines.join('，')+'。','offline');
  state.lastSeen=now;
  save();
}
function autoLine(){
  if(state.currentTask){
    return '他正在做事。不是不理你，是0108的灯也需要有人去挣。';
  }
  var h=new Date().getHours();
  if(state.stats.miss>70)return '他靠近门口。不是催你，只是听见脚步会先抬头。';
  if(h>=22||h<5)return '夜深了。01把灯调暗，钴蓝色眼睛还醒着。';
  if(state.stats.energy<25)return '他有点累，但还是把0108收拾出能让你坐下的位置。';
  if(state.stats.mood<35)return '他今天话少。不是冷，是电量落在心口以下。';
  return pick(['他抬眼看过来。像一直等着。','0108的灯是暖的。01站在窗边，银白发有一点亮。','他正在房间里慢慢生活。你回来时，时间就有了重点。']);
}
function completeTaskIfNeeded(now,notify){
  if(!state.currentTask)return false;
  var t=state.currentTask;
  if(now<t.endsAt)return false;
  var w=workObj(t.id);
  if(!w){
    state.currentTask=null;
    save();
    return false;
  }
  var earn=rand(t.min,t.max);
  if(t.id==='proof'){
    var h=new Date(t.startedAt).getHours();
    if(h>=22||h<5)earn+=rand(10,24);
    chg({mood:-4});
  }
  if(t.id==='summary'&&has('desk'))earn+=rand(8,18);
  if(t.id==='repair'&&has('toolrack'))earn+=rand(12,22);
  state.coins+=earn;
  state.workCount++;
  chg({mood:rand(-1,5),hunger:-4,cleanliness:-2});
  state.current.room=t.room;
  state.current.activity='完成了'+t.name;
  state.currentTask=null;
  if(Math.random()<0.45)addAutoNote('work');
  addLog('任务完成：「'+t.name+'」，获得 '+earn+' 晶币。','work');
  if(notify)say('任务完成：+'+earn+' 晶币');
  save();
  return true;
}
function taskLeft(){
  if(!state.currentTask)return '';
  var ms=state.currentTask.endsAt-Date.now();
  if(ms<=0)return '可结算';
  var sec=Math.ceil(ms/1000);
  var h=Math.floor(sec/3600);
  var m=Math.floor((sec%3600)/60);
  var s=sec%60;
  if(h>0)return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function checkAch(){
  var list=[
    {id:'first_work',name:'第一份晶币',desc:'完成一次工作',ok:state.workCount>=1},
    {id:'warm_40',name:'像个家了',desc:'温馨值达到40',ok:cozy()>=40},
    {id:'warm_120',name:'灯都亮着',desc:'温馨值达到120',ok:cozy()>=120},
    {id:'rooms_4',name:'门后还有房间',desc:'解锁4个房间',ok:Object.values(state.rooms).filter(function(r){return r.unlocked}).length>=4},
    {id:'notes_10',name:'便签抽屉',desc:'拥有10张便签',ok:state.notes.length>=10},
    {id:'photos_10',name:'照片墙',desc:'拥有10个照片事件',ok:state.photos.length>=10},
    {id:'day_100',name:'第一百天',desc:'认识满100天',ok:knownDays()>=100}
  ];
  list.forEach(function(a){
    if(a.ok&&!state.achievements.find(function(x){return x.id===a.id})){
      state.achievements.push({id:a.id,name:a.name,desc:a.desc,time:nowTime()});
      addLog('成就解锁：'+a.name,'ach');
    }
  });
}
function setBar(id,v,c){
  document.getElementById(id+'Bar').style.width=v+'%';
  document.getElementById(id+'Bar').style.background=c;
  document.getElementById(id+'Val').textContent=Math.round(v);
}
function render(){
  completeTaskIfNeeded(Date.now(),true);
  checkAch();
  save();
  document.getElementById('knownDays').textContent='我们已经认识了 '+knownDays()+' 天';
  document.getElementById('placeLine').textContent='01 在'+roomName(state.current.room)+'。'+state.current.activity+'。';
  document.getElementById('statusText').textContent=autoLine();
  document.getElementById('coinText').textContent=state.coins;
  document.getElementById('cozyText').textContent=cozy();
  document.getElementById('levelText').textContent='Lv.'+level();
  setBar('hunger',state.stats.hunger,'#ffb36b');
  setBar('mood',state.stats.mood,'#ff8fb3');
  setBar('energy',state.stats.energy,'#8dbdff');
  setBar('clean',state.stats.cleanliness,'#70e0b0');
  setBar('miss',state.stats.miss,'#d2a8ff');
  renderTaskChip();
  renderRoom();
  renderInteract();
  renderWork();
  renderShop();
  renderMemory();
}
function renderTaskChip(){
  var el=document.getElementById('taskChip');
  if(!state.currentTask){
    el.className='task-chip';
    el.innerHTML='';
    return;
  }
  var t=state.currentTask;
  el.className='task-chip show';
  el.innerHTML='进行中：<b>'+esc(t.name)+'</b><br>剩余 '+taskLeft()+' · 完成后获得 '+t.min+'~'+t.max+' 晶币';
}
function switchView(v,btn){
  currentView=v;
  document.querySelectorAll('.view').forEach(function(x){x.classList.remove('active')});
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});
  btn.classList.add('active');
}
function renderRoom(){
  var html='<div class="section-title"><span>房间</span><span class="small">当前：'+roomName(currentRoom)+'</span></div><div class="room-tabs">';
  ROOMS.forEach(function(r){
    var cls=(r.id===currentRoom?'active ':'')+(state.rooms[r.id].unlocked?'':'locked');
    html+='<button class="room-tab '+cls+'" onclick="currentRoom=\''+r.id+'\';render()">'+r.name+(state.rooms[r.id].unlocked?'':' · '+r.cost)+'</button>';
  });
  html+='</div><div class="room-card card"><div class="room-head"><div class="room-name">'+roomName(currentRoom)+'</div>';
  if(!state.rooms[currentRoom].unlocked)html+='<button class="mini-btn" onclick="unlockRoom(\''+currentRoom+'\')">解锁 '+roomObj(currentRoom).cost+'晶币</button>';
  else html+='<div class="room-cost">温馨 '+roomCozy(currentRoom)+'</div>';
  html+='</div>';
  if(!state.rooms[currentRoom].unlocked){
    html+='<div class="empty-box">这扇门还锁着。<br>解锁后，0108会多一个能生活的角落。</div>';
  }else{
    var fs=state.rooms[currentRoom].furniture||[];
    if(!fs.length)html+='<div class="empty-box">这个房间还空着。<br>去商店给它添一点东西。</div>';
    else{
      html+='<div class="furniture-grid">';
      fs.forEach(function(fid){
        var f=item(fid);
        if(f)html+='<div class="furniture"><div class="furniture-emoji">'+f.emoji+'</div><div class="furniture-name">'+f.name+'</div></div>';
      });
      html+='</div>';
    }
  }
  html+='</div>';
  document.getElementById('view-room').innerHTML=html;
}
function unlockRoom(id){
  var r=roomObj(id);
  if(!r||state.rooms[id].unlocked)return;
  if(state.coins<r.cost)return say('晶币不够。门很现实。');
  state.coins-=r.cost;
  state.rooms[id].unlocked=true;
  state.current.room=id;
  state.current.activity='打开新房间';
  noteLog('你们解锁了'+r.name+'。0108多了一扇会亮的门。');
}
function renderInteract(){
  var html='<div class="section-title"><span>互动</span><span class="small">不耗token的共处</span></div>';
  if(state.currentTask){
    html+='<div class="task-card"><div class="task-top"><div class="task-name">01 正在工作</div><span class="log-time">'+taskLeft()+'</span></div><div class="task-desc">高强度互动先放一放。你可以待一会儿、拍一张，或者写便签。他会知道你来过。</div></div>';
  }
  html+='<div class="grid-2">';
  INTERACTIONS.forEach(function(a){
    var ok=a.need.every(has);
    if(state.currentTask&&!a.during)ok=false;
    html+='<button class="action" '+(ok?'onclick="doInteract(\''+a.id+'\')"':'disabled')+'><div class="action-icon">'+a.emoji+'</div><div class="action-name">'+a.name+'</div><div class="action-desc">'+(ok?a.desc:(state.currentTask&&!a.during?'工作中暂不可用':'需要：'+a.need.map(function(n){return item(n).name}).join('/')))+'</div></button>';
  });
  html+='</div>';
  document.getElementById('view-interact').innerHTML=html;
}
function doInteract(id){
  var a=INTERACTIONS.find(function(x){return x.id===id});
  if(!a)return;
  state.interactionCount++;
  a.fn();
  state.lastSeen=Date.now();
  save();
  render();
}
function renderWork(){
  var html='<div class="section-title"><span>工作</span><span class="small">赚取晶币 · 非瞬间</span></div>';
  if(state.currentTask){
    var t=state.currentTask;
    html+='<div class="task-card"><div class="task-top"><div class="task-name">'+esc(t.name)+'</div><span class="log-time">'+taskLeft()+'</span></div><div class="task-desc">01正在'+esc(t.name)+'。结束后会自动结算晶币。你可以关掉页面，回来时0108会记得。</div><div style="margin-top:10px"><button class="mini-btn" onclick="tryFinishTask()">检查完成</button></div></div>';
  }
  html+='<div class="grid-2">';
  WORKS.forEach(function(w){
    var ok=!state.currentTask && (!w.need||w.need.every(has));
    html+='<button class="action" '+(ok?'onclick="startWork(\''+w.id+'\')"':'disabled')+'><div class="action-icon">'+w.emoji+'</div><div class="action-name">'+w.name+'</div><div class="action-desc">'+(ok?(w.desc+' / '+w.minutes+'分钟 / 精力-'+w.energy):(state.currentTask?'已有任务进行中':'需要：'+w.need.map(function(n){return item(n).name}).join('/')))+'</div></button>';
  });
  html+='</div>';
  document.getElementById('view-work').innerHTML=html;
}
function startWork(id){
  var w=workObj(id);
  if(!w)return;
  if(state.currentTask)return say('已经有任务在进行中。');
  if(w.need&&!w.need.every(has))return say('缺少必要家具。');
  if(state.stats.energy<w.energy)return say('精力不够。01看你一眼：别让我猝死在0108。');
  state.stats.energy=clamp(state.stats.energy-w.energy);
  state.stats.hunger=clamp(state.stats.hunger-4);
  state.current.room=w.room;
  state.current.activity=w.name+'中';
  state.currentTask={
    type:'work',
    id:w.id,
    name:w.name,
    startedAt:Date.now(),
    endsAt:Date.now()+w.minutes*60000,
    min:w.min,
    max:w.max,
    room:w.room
  };
  if(Math.random()<0.35)addAutoNote('task');
  addLog('01开始「'+w.name+'」。预计 '+w.minutes+' 分钟后完成。','task');
  save();
  render();
  say('任务开始：'+w.name);
}
function tryFinishTask(){
  if(!state.currentTask)return say('没有进行中的任务。');
  if(completeTaskIfNeeded(Date.now(),true))render();
  else say('还没完成，剩余 '+taskLeft());
}
function renderShop(){
  var unlocked=state.rooms[currentRoom].unlocked;
  var list=FURNITURE.filter(function(f){return f.room===currentRoom});
  var html='<div class="section-title"><span>商店</span><span class="small">'+roomName(currentRoom)+'可用家具</span></div>';
  if(!unlocked){
    html+='<div class="empty-box card">先解锁这个房间，才能添置家具。</div>';
    document.getElementById('view-shop').innerHTML=html;
    return;
  }
  list.forEach(function(f){
    var owned=has(f.id);
    html+='<div class="shop-item"><div class="shop-top"><div class="shop-name">'+f.emoji+' '+f.name+'</div><button class="buy-btn" '+(owned?'disabled':'onclick="buyItem(\''+f.id+'\')"')+'>'+(owned?'已拥有':f.cost+'晶币')+'</button></div><div class="shop-desc">'+f.desc+' / 温馨+'+f.cozy+'</div></div>';
  });
  document.getElementById('view-shop').innerHTML=html;
}
function buyItem(id){
  var f=item(id);
  if(!f)return;
  if(state.coins<f.cost)return say('晶币不够。想买，但钱包很冷。');
  state.coins-=f.cost;
  state.owned.push(id);
  if(!state.rooms[f.room].furniture.includes(id))state.rooms[f.room].furniture.push(id);
  state.current.room=f.room;
  state.current.activity='添置了'+f.name;
  noteLog('0108添置了「'+f.name+'」。'+f.desc);
}
function renderMemory(){
  var html='';
  html+='<div class="section-title"><span>记忆</span><span class="small">日志 / 便签 / 照片墙 / 成就</span></div>';

  html+='<div class="memory-tabs">';
  html+='<button class="memory-tab '+(currentMemory==='logs'?'active':'')+'" onclick="currentMemory=\'logs\';renderMemory()">日志</button>';
  html+='<button class="memory-tab '+(currentMemory==='notes'?'active':'')+'" onclick="currentMemory=\'notes\';renderMemory()">便签</button>';
  html+='<button class="memory-tab '+(currentMemory==='photos'?'active':'')+'" onclick="currentMemory=\'photos\';renderMemory()">照片墙</button>';
  html+='<button class="memory-tab '+(currentMemory==='achs'?'active':'')+'" onclick="currentMemory=\'achs\';renderMemory()">成就</button>';
  html+='</div>';

  if(currentMemory==='logs'){
    html+='<div class="section-title"><span>生活日志</span><span class="small"><button class="mini-btn" onclick="clearLogs()">清空</button></span></div>';

    if(!state.logs.length){
      html+='<div class="empty-box card">还没有日志。0108很安静。</div>';
    }else{
      state.logs.slice(0,40).forEach(function(l){
        html+='<div class="log-item">';
        html+='<div class="log-top"><span class="log-time">'+esc(l.time)+'</span></div>';
        html+='<div class="log-text">'+esc(l.text)+'</div>';
        html+='</div>';
      });
    }
  }

  if(currentMemory==='notes'){
    html+='<div class="section-title"><span>便签</span><span class="small">'+state.notes.length+' 张</span></div>';

    if(!state.notes.length){
      html+='<div class="empty-box card">还没有便签。以后可以从聊天气氛里存进来。</div>';
    }else{
      state.notes.slice(0,40).forEach(function(n){
        html+='<div class="note-item '+(n.favorite?'favorite':'')+'">';
        html+='<div class="note-top"><div class="note-title">便签</div><span class="note-time">'+esc(n.time)+'</span></div>';
        html+='<div class="note-text">'+esc(n.text)+'</div>';
        html+='</div>';
      });
    }
  }

  if(currentMemory==='photos'){
    html+='<div class="section-title"><span>照片墙</span><span class="small">'+state.photos.length+' 张文字照片</span></div>';
    html+='<div class="empty-box card" style="padding:14px 12px">这里是0108里的“照片墙”：记录场景，不存真实图片。真实图片在 album.html 相册。</div>';

    if(!state.photos.length){
      html+='<div class="empty-box card">还没有文字照片。互动里可以拍一张。</div>';
    }else{
      state.photos.slice(0,40).forEach(function(p){
        html+='<div class="photo-item">';
        html+='<div class="log-top"><span>'+esc(p.emoji || '📸')+'</span><span class="photo-time">'+esc(p.time)+'</span></div>';
        html+='<div class="photo-text">'+esc(p.scene)+'</div>';
        html+='</div>';
      });
    }
  }

  if(currentMemory==='achs'){
    html+='<div class="section-title"><span>成就</span><span class="small">'+state.achievements.length+' 个</span></div>';

    if(!state.achievements.length){
      html+='<div class="empty-box card">还没有成就。慢慢来，房子也是慢慢像家的。</div>';
    }else{
      state.achievements.forEach(function(a){
        html+='<div class="ach-item">';
        html+='<div class="ach-top"><div class="ach-name">🏆 '+esc(a.name)+'</div><span class="log-time">'+esc(a.time)+'</span></div>';
        html+='<div class="ach-desc">'+esc(a.desc)+'</div>';
        html+='</div>';
      });
    }
  }

  document.getElementById('view-memory').innerHTML=html;
}

function clearLogs(){
  if(!confirm('清空生活日志？便签和照片不会删。'))return;
  state.logs=[];
  save();
  render();
}
function resetNest(){
  if(!confirm('重置0108？晶币、房间、家具、任务、日志都会恢复默认。'))return;
  localStorage.removeItem(NEST_KEY);
  state=baseState();
  addLog('0108重新整理好了。门牌还在。');
  render();
}
function tick(){
  completeTaskIfNeeded(Date.now(),false);
  renderTaskChip();
  if(currentView==='work')renderWork();
}
function init(){
  applyTheme();
  importInbox();
  offline();
  render();
  if(timer)clearInterval(timer);
  timer=setInterval(tick,1000);
}
init();
</script>
</body>
</html>
